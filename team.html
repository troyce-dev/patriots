<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats Football — Team</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/team.css">
</head>
<body class="team-body">
  <main class="team-wrap">
    <section id="login" class="t-card hidden">
      <h1>🏈 Stats Football</h1>
      <p class="hint">Type the room code shown on the projector. You'll be put on the next open team.</p>
      <label class="block">Room code <input id="l-room" type="text" autocomplete="off" autocapitalize="characters" maxlength="8"></label>
      <button id="l-go" class="primary big wide">Join game ▶</button>
      <p id="l-msg" class="msg"></p>
    </section>

    <section id="play" class="hidden">
      <header class="t-head">
        <div class="t-helmet" id="t-helmet"></div>
        <div class="t-who"><div class="t-name" id="t-name"></div><div class="t-yards" id="t-yards"></div></div>
        <button id="t-logout" class="ghost small">Leave team</button>
      </header>
      <div id="t-main" class="t-card"></div>
      <div id="t-board" class="t-board"></div>
    </section>

    <section id="fatal" class="t-card hidden"></section>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/live.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
